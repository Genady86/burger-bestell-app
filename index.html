<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route 66 Burger House</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <div class="brand">Route 66 Burger House</div>
            <button class="menu-button" type="button" aria-label="Menü öffnen">
                ☰
            </button>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <img class="hero-image" src="./assets/img/restaurant.jpg" alt="Route 66 Burger House">

            <div class="restaurant-logo">
                <span>ROUTE</span>
                <strong>66</strong>
            </div>
        </section>

        <div class="page-layout">

            <section class="restaurant-content">

                <div class="restaurant-info">
                    <h1>Route 66 Burger House</h1>

                    <div class="rating">
                        ★★★★★ 4,8
                    </div>

                    <p>
                        American burgers, big flavor and real diner style.
                    </p>
                </div>

                <section class="dish-section">
                    <h2>American Burgers</h2>

                    <div id="dishContent">
                    </div>
                </section>

            </section>

            <aside class="basket">
                <h2>Warenkorb</h2>

                <div id="basketContent">
                    Dein Warenkorb ist leer.
                </div>
            </aside>

        </div>
    </main>

    <footer>
        <p>© Route 66 Burger House</p>
    </footer>

    <script src="./data.js"></script>
    <script src="./script.js"></script>

</body>

</html>
